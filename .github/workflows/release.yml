name: Release
on:
  # Can be run manually
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip test
        type: boolean
        default: false

  # on git push
  push:
    branches:
      - main

# Only one run at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Answers "did this commit arrive through a pull request, and from which branch?" - which the
  # `test` job's own `if:` cannot ask, because a job condition is evaluated before any job runs and
  # a push payload says nothing about a pull request. See that workflow's own header for the merge
  # routes and why parsing the commit message covered only one of them.
  source:
    uses: panates/github-actions/.github/workflows/pr-source.yaml@v3
    permissions:
      contents: read
      pull-requests: read

  test:
    needs: source
    # **`head-ref != 'dev'` is an exact comparison, which the old `contains(msg, '/dev')` was not** -
    # a pull request from `develop`, `dev-hotfix` or this repository's own `platformatic_kafka` used
    # to skip the tests it should have run, because every one of those names contains the substring.
    #
    # An empty `head-ref` means "came from no pull request" - a direct push, or a local
    # `git merge dev && git push` - and runs the tests, which is the safe direction: nothing
    # recorded that this exact commit was tested anywhere.
    #
    # The payoff is larger here than anywhere else in the organization: this repository's test job
    # raises Kafka, Postgres, MongoDB, Elasticsearch and RabbitMQ before it runs a single spec.
    if: >
      !contains(github.event.head_commit.message, 'no-release') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-tests != 'true') ||
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, 'no-test') &&
          needs.source.outputs.head-ref != 'dev'
        )
      )
    uses: ./.github/workflows/test.yml

  release:
    needs: [source, test]
    # `always()` because `needs` alone would block this whenever `test` is *skipped*, which is the
    # normal path for a `no-test` commit or a pull request merged from dev. This one condition
    # replaces the pair of mirror-image jobs that used to be here - `release_after_test` with
    # `needs: test`, and `release` with the test condition negated - which meant the release call
    # was written twice and the two conditions had to be kept in step by hand. They had already
    # drifted: `release_after_test` carried no `if:` at all, so it ran on every successful test.
    #
    # **`needs.source.result == 'success'` is the second lock on the same door.** This job accepts
    # `test` being *skipped*, and `test` is skipped whenever `source` fails - so without that clause
    # an API hiccup in the lookup would release untested code, which is the one outcome this whole
    # arrangement exists to prevent. The lookup step is written never to fail; this is what covers
    # the case where it does anyway.
    if: >
      always() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !contains(github.event.head_commit.message, 'no-release')
    uses: panates/github-actions/.github/workflows/node-release.yaml@v3
    # Declared on the calling job, because that is what governs a reusable workflow's permissions.
    # `contents: write` is what `rman version --push`, its tags and the GitHub Release need;
    # `id-token: write` is only used if this repository switches to npm Trusted Publishing, and
    # costs nothing meanwhile.
    permissions:
      id-token: write
      contents: write
    secrets:
      # PERSONAL_ACCESS_TOKEN is gone: measured, every publishable manifest here carries
      # `publishConfig: {"access": "public"}`, no manifest names a custom registry and there is no
      # .npmrc anywhere in the repository - so the token had nothing to authenticate.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
