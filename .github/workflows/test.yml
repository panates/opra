name: Test
on:
  # Can be called from other workflows
  # `PERSONAL_ACCESS_TOKEN` is gone: measured, every publishable manifest here carries
  # `publishConfig: {"access": "public"}`, no manifest names a custom registry and there is no
  # .npmrc anywhere - so the token had nothing to authenticate.
  workflow_call:

  # Can be run manually
  workflow_dispatch:

  # on git push
  push:
    # Every branch except the release one. `branches: [dev]` meant a feature branch ran no tests
    # until it was merged, and `main` is where release.yml takes over.
    branches-ignore:
      - main
    # **No brace expansion.** GitHub's path filter syntax is `*`, `**`, `?`, `+`, `[]`, `!` and
    # `\` - and nothing else. `'**/*.{ts,js,mjs,cjs}'` is therefore matched *literally*, so it
    # never selected a single file: a push to `dev` touching only TypeScript did not run the tests,
    # silently. What kept the trigger alive at all was the two entries below it, which meant the
    # tests effectively ran only when a manifest or a tsconfig changed. A filter matching too much
    # costs a minute of CI; one matching too little costs a release nobody tested.
    paths:
      # This file itself: a change to how the tests run is a reason to run them.
      - '.github/workflows/test.yml'
      - 'packages/**'
      - 'examples/**'
      - 'support/**'
      # How anything is compiled, run or measured.
      - '**/tsconfig*.json'
      - '**/.mocharc.*'
      - '.c8rc.json'
      - '**/package.json'
      - 'package-lock.json'
      - '.rmanrc.yml'

# The workflow only ever reads the repository: it checks out, installs and runs tests. Anything it
# reports goes out through a separate credential - Coveralls uses its own token, and releases happen
# in release.yml - so GITHUB_TOKEN never needs write access here. Set explicitly rather than left to
# the repository default, which is org-wide and can be widened later without anyone editing this
# file.
permissions:
  contents: read

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KAFKA_BROKERS: localhost:9092
#  SKIP_KAFKA_TESTS: "true"
#  SKIP_SQB_TESTS: "true"
#  SKIP_RABBITMQ_TESTS: "true"
#  SKIP_ELASTIC_TESTS: "true"

jobs:
  test:
    # **The "was this a merge from dev" half is gone from here, and that is not a relaxation.** It
    # was a second copy of release.yml's condition - and inside a `workflow_call`
    # `github.event_name` is the *caller's* event (`push`), so the identical guard was evaluated
    # twice on every release, in two files that had to be kept in step by hand. The decision lives
    # once now, in release.yml, and is answered by the GitHub API (`pr-source.yaml@v3`) rather than
    # by reading a commit message - which only ever recognised one of the three merge buttons.
    #
    # It was also wrong here on its own terms, twice over: this workflow's own trigger is a push to
    # `dev`, so a merge *into* dev from any branch whose name merely contains `/dev` skipped its
    # tests; and `contains(..., '/dev')` is a substring test, which this repository's own
    # `platformatic_kafka` and `api-ui` branches would never match while a `feature/devtools` would.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'no-test')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      kafka:
        image: confluentinc/confluent-local:latest
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      postgres:
        image: 'postgres'
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: 'rabbitmq'
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait Kafka
        run: |
          for i in {1..60}; do
            nc -z localhost 9092 && exit 0
            sleep 1
          done
          exit 1

      # `panates/ghac-setup-node` is this action's old name - it still resolves through GitHub's
      # rename redirect, which is why nobody noticed it was stale. `@v2` also replaces the separate
      # unpinned `npm install rman -g` with `rman-version`, which is what pins the *major* that this
      # repository's config keys need; and `install: 'ci'` installs exactly what the lockfile pins,
      # where `@v1` deleted package-lock.json first and installed whatever resolved that morning.
      - name: 'Setup Environment'
        uses: panates/gh-setup-node@v2
        with:
          node-version: '24'
          rman-version: '2'
          install: 'ci'

      - name: Configure sysctl limits
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: 8.0
          mongodb-replica-set: test-rs

      - name: Runs Elasticsearch
        uses: elastic/elastic-github-actions/elasticsearch@master
        with:
          stack-version: 9.0.0
          security-enabled: false

      #      - name: Run Kafka KRaft Broker
      #        uses: spicyparrot/kafka-kraft-action@v1.1.3
      #        with:
      #          kafka-version: "3.7.0"
      #          kafka-topics: "feed-cat,1,feed-dog,1,email-channel-1,1,email-channel-2,1,sms-channel-1,1,sms-channel-2,1"

      # **`rman run qc` named a script no package defines, and rman 2.x fails on that.** The root's
      # own `qc` never counted: rman deliberately does not treat a monorepo root's script as
      # defining one, since the root contributes only its pre/post bookends - so under 1.x the step
      # ran nothing and reported success, and under 2.x it exits 1 with `No package defines a "qc"
      # script.` (measured). Nothing here pinned rman's version either - `ghac-setup-node@v1` did a
      # bare `npm i rman -g` - so this step began failing the moment rman 2.x became `latest`, which
      # is why the last green run on this workflow was 2026-09-10. The setup step above pins the
      # major now.
      #
      # The two commands are `@panates/rman-preset`'s, and both are repository-wide by design: one
      # dpdm pass and one eslint pass over the whole tree, which is what a flat eslint config
      # already expects and what the per-package fan-out could never reach - `support/test/` belongs
      # to no package and had never been linted at all.
      - name: Check for circular dependencies
        run: rman check

      - name: Lint
        run: rman lint

      - name: Run unit tests
        run: npm run citest
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          KAFKA_BROKER: localhost:9092
          ELASTIC_HOST: http://localhost:9200

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
